
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <button
      (click)="backToLogin()"
      class="text-sm text-purple-600 hover:underline mb-6">
      ← Back to Login
    </button>

    <h1 class="text-3xl font-bold text-gray-900 mb-2">
      Forgot Password
    </h1>

    <p class="text-gray-500 mb-6">
      Enter your registered email address and we'll send you a password reset link.
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Email Address
        </label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="you@example.com"
          class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold disabled:opacity-60">

        {{ loading ? 'Sending...' : 'Send Reset Link' }}

      </button>

      <div
        *ngIf="successMessage"
        class="p-3 rounded-lg bg-green-50 text-green-700 text-sm border border-green-200">

        {{ successMessage }}

      </div>

      <div
        *ngIf="errorMessage"
        class="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200">

        {{ errorMessage }}

      </div>

    </form>

  </div>
</div>
