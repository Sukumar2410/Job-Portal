<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <h1 class="text-3xl font-bold text-gray-900 mb-2">
            Create New Password
        </h1>

        <p class="text-gray-500 mb-6">
            Enter your new password below.
        </p>

        <form (ngSubmit)="onSubmit()" class="space-y-5">

            <div>
                <label class="block text-sm font-semibold mb-2">
                    New Password
                </label>

                <div class="relative">
                    <input
                        [type]="showNewPassword ? 'text' : 'password'"
                        [(ngModel)]="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 pr-12 border rounded-xl">

                    <button
                        type="button"
                        (click)="showNewPassword = !showNewPassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">

                        {{ showNewPassword ? '🙈' : '👁️' }}

                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Confirm Password
                </label>

                <div class="relative">
                    <input
                        [type]="showConfirmPassword ? 'text' : 'password'"
                        [(ngModel)]="confirmPassword"
                        name="confirmPassword"
                        required
                        class="w-full px-4 py-3 pr-12 border rounded-xl">

                    <button
                        type="button"
                        (click)="showConfirmPassword = !showConfirmPassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">

                        {{ showConfirmPassword ? '🙈' : '👁️' }}

                    </button>
                </div>
            </div>

            <button
                type="submit"
                [disabled]="loading"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold">

                {{ loading ? 'Updating...' : 'Reset Password' }}

            </button>

            <div
                *ngIf="successMessage"
                class="p-3 rounded-lg bg-green-50 text-green-700 border">

                {{ successMessage }}

            </div>

            <div
                *ngIf="errorMessage"
                class="p-3 rounded-lg bg-red-50 text-red-700 border">

                {{ errorMessage }}

            </div>

        </form>

    </div>
</div>
