<div class="fixed top-5 right-5 z-[9999] space-y-3 w-80">

  <div
    *ngFor="let t of toast.toasts()"
    class="toast animate-slide-in"
    [ngClass]="t.type">

    <div class="icon">

      <span *ngIf="t.type==='success'">✅</span>

      <span *ngIf="t.type==='error'">❌</span>

      <span *ngIf="t.type==='warning'">⚠️</span>

      <span *ngIf="t.type==='info'">ℹ️</span>

    </div>

    <div class="message">
      {{t.message}}
    </div>

    <button (click)="toast.remove(t.id)">
      ✕
    </button>

  </div>

</div>
